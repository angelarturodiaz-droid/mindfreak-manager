name: Respaldo diario (base de datos + Storage)

# Corre solo, en la infraestructura de GitHub — no depende de que tu Mac
# ni ningún otro equipo estén prendidos. Ver scripts/backup/README.md
# para qué secretos hay que configurar y cómo restaurar un respaldo.

on:
  schedule:
    # 08:10 UTC = ~04:10 hora de Santo Domingo (UTC-4). El minuto :10 (no
    # :00 en punto) evita la hora pico de crons de GitHub.
    - cron: "10 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (solo scripts de respaldo)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/backup

      - name: Instalar dependencias del script de Storage
        run: npm install @supabase/supabase-js --no-save

      - name: Volcar la base de datos (pg_dump vía Docker, Postgres 17 — misma versión que Supabase)
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/backup/db
          docker run --rm postgres:17 \
            pg_dump "$BACKUP_DB_URL" \
              --schema=public \
              --no-owner --no-privileges \
              --format=plain \
            > /tmp/backup/db/public.sql
          echo "Tamaño del dump: $(du -h /tmp/backup/db/public.sql | cut -f1)"

      - name: Descargar todos los archivos de Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          mkdir -p /tmp/backup/storage
          node scripts/backup/backup-storage.mjs /tmp/backup/storage

      - name: Empaquetar y cifrar
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          cd /tmp/backup
          tar -czf "backup-$STAMP.tar.gz" db storage
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "backup-$STAMP.tar.gz" \
            -out "/tmp/backup-$STAMP.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Publicar en la rama 'backups' (conserva los últimos 30 días)
        run: |
          set -euo pipefail
          git config --global user.name "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"

          git clone --depth=1 --branch backups "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/backups-repo 2>/dev/null || {
            mkdir -p /tmp/backups-repo
            cd /tmp/backups-repo
            git init
            git checkout --orphan backups
            echo "# Respaldos de Mindfreak Manager" > README.md
            echo "" >> README.md
            echo "Archivos cifrados, uno por día. Ver scripts/backup/README.md (en la rama main) para restaurar." >> README.md
            git add README.md
            git commit -m "Iniciar rama de respaldos"
            cd -
          }

          cp "/tmp/backup-$STAMP.tar.gz.enc" "/tmp/backups-repo/backup-$STAMP.tar.gz.enc"
          cd /tmp/backups-repo

          # Conservar solo los últimos 30 respaldos (borra los .enc más viejos que sobren).
          ls -1 backup-*.tar.gz.enc 2>/dev/null | sort | head -n -30 | xargs -r rm -f

          git add -A
          git commit -m "Respaldo $STAMP" --allow-empty
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" backups
